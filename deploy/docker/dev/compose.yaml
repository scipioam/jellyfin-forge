name: jellyfin-forge-dev
services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    user: "${JELLYFIN_FORGE_UID:-1000}:${JELLYFIN_FORGE_GID:-1000}"
    ports:
      - "127.0.0.1:18096:8096"
    volumes:
      # Paths are relative to this compose.yaml; edit these directories on the host.
      - type: bind
        source: ./config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./media
        target: /media
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
