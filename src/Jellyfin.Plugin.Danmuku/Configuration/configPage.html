<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Danmuku</title></head>
<body>
<div id="DanmukuConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-checkbox,emby-button">
    <div data-role="content"><div class="content-primary">
        <h2>Danmuku</h2>
        <p>Independent danmuku management for Jellyfin. Bootstrap configuration only.</p>
        <form id="DanmukuConfigForm">
            <div class="inputContainer">
                <label class="inputLabel" for="DanmukuInstanceLabel">Instance label</label>
                <input is="emby-input" id="DanmukuInstanceLabel" type="text" />
            </div>
            <div class="checkboxContainer">
                <label>
                    <input is="emby-checkbox" type="checkbox" id="DanmukuEnableWebSupport" />
                    <span>Enable Jellyfin Web danmuku support</span>
                </label>
            </div>
            <p id="DanmukuError" role="alert"></p>
            <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
        </form>
    </div></div>
    <script>
    (function () {
        var page = document.querySelector('#DanmukuConfigPage');
        var pluginId = '6f79690c-c1d0-4738-b241-09aaa2c570e7';
        function failed() {
            Dashboard.hideLoadingMsg();
            page.querySelector('#DanmukuError').textContent = 'Unable to load or save configuration. Please retry.';
        }
        page.addEventListener('pageshow', function () {
            page.querySelector('#DanmukuError').textContent = '';
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                page.querySelector('#DanmukuInstanceLabel').value = config.InstanceLabel;
                page.querySelector('#DanmukuEnableWebSupport').checked = config.EnableWebSupport === true;
                Dashboard.hideLoadingMsg();
            }).catch(failed);
        });
        page.querySelector('form').addEventListener('submit', function (event) {
            event.preventDefault();
            page.querySelector('#DanmukuError').textContent = '';
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                config.InstanceLabel = page.querySelector('#DanmukuInstanceLabel').value;
                config.EnableWebSupport = page.querySelector('#DanmukuEnableWebSupport').checked;
                return ApiClient.updatePluginConfiguration(pluginId, config);
            }).then(function (result) {
                Dashboard.processPluginConfigurationUpdateResult(result);
            }).catch(failed);
        });
    }());
    </script>
</div>
</body>
</html>
